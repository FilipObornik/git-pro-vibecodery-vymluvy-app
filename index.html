<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Výmluvomat 3000</title>
<style>
  :root {
    --paper:   #f7f5f2;
    --card:    #ffffff;
    --ink:     #1c1a17;
    --muted:   #8a827a;
    --line:    #e2ddd6;
    --accent:  #2f6fd8;
    --shadow:  0 1px 2px rgba(28,26,23,.05), 0 8px 24px rgba(28,26,23,.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #14130f;
      --card:   #1e1c18;
      --ink:    #f0ece5;
      --muted:  #8a827a;
      --line:   #2c2924;
      --accent: #3d8aff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px 96px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  .sub { color: var(--muted); margin: 0; font-size: 15px; }

  /* ---- filtry ---- */

  .filtry {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }

  .chip:hover { color: var(--ink); border-color: var(--muted); }

  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .chip-oblibene {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .chip-oblibene:hover { color: var(--accent); border-color: var(--accent); }

  .chip-oblibene[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---- karta s výmluvou ---- */

  .karta {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 40px 32px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }

  .vymluva {
    margin: 0;
    font-size: 24px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    font-weight: 500;
  }

  .vymluva.uvodni { color: var(--muted); font-weight: 400; font-size: 19px; }

  .stitek {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    min-height: 18px;
  }

  @keyframes prilet {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .karta.nova .vymluva, .karta.nova .stitek { animation: prilet .28s ease-out; }

  /* ---- srdíčko (oblíbené) ---- */

  .srdce {
    display: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    transition: transform .1s, color .15s;
  }

  .srdce:hover { color: var(--accent); }
  .srdce:active { transform: scale(.9); }
  .srdce[aria-pressed="true"] { color: var(--accent); }

  /* ---- tlačítko ---- */

  .akce { display: flex; justify-content: center; margin: 28px 0 16px; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 12px;
    padding: 14px 28px;
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .08s, filter .15s;
  }

  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }

  .pocitadlo {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .pocitadlo b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .pocitadlo .oddelovac { margin: 0 8px; opacity: .45; }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    background: var(--card);
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Výmluvomat 3000</h1>
    <p class="sub">Nefunguje to? Nevadí. Hlavně že to není tvoje vina.</p>
  </header>

  <div class="filtry" id="filtry"></div>

  <div class="karta" id="karta" aria-live="polite">
    <p class="vymluva uvodni" id="vymluva">Zmáčkni tlačítko a nemáš to.</p>
    <span class="stitek" id="stitek"></span>
    <button class="srdce" id="srdce" aria-pressed="false" title="Přidat do oblíbených">♡</button>
  </div>

  <div class="akce">
    <button class="btn" id="btn">Potřebuju výmluvu</button>
  </div>

  <p class="pocitadlo">Vyžehleno situací: <b id="pocet">0</b><span class="oddelovac">·</span>V zásobě: <b id="zasoba">0</b> <span id="zasobaSlovo">výmluv</span></p>

  <footer>
    Funguje i <kbd>mezerník</kbd>. Kdyby ne, zkus to vypnout a zapnout.
  </footer>

</div>

<script>
/* ==========================================================================
   Výmluvy se načítají z vymluvy.json (viz soubor vedle tohoto).
   Jeden objekt = jedna výmluva. Kategorii si klidně vymysli vlastní,
   filtry nahoře se dogenerují samy.
   ========================================================================== */

let VYMLUVY = [];

/* ---- stav ---- */

let kategorie = "vše";
let pocet = 0;
let posledni = null;

/* Oblíbené se drží jenom v paměti - po zavření nebo obnovení stránky zmizí. */
const OBLIBENE = "★ oblíbené";
const oblibene = new Set();

const el = {
  filtry:      document.getElementById("filtry"),
  karta:       document.getElementById("karta"),
  vymluva:     document.getElementById("vymluva"),
  stitek:      document.getElementById("stitek"),
  srdce:       document.getElementById("srdce"),
  btn:         document.getElementById("btn"),
  pocet:       document.getElementById("pocet"),
  zasoba:      document.getElementById("zasoba"),
  zasobaSlovo: document.getElementById("zasobaSlovo"),
};

/* ---- výmluvy, ze kterých se zrovna losuje (podle zvoleného filtru) ---- */

function fond() {
  if (kategorie === OBLIBENE) return [...oblibene];
  return VYMLUVY.filter(v => kategorie === "vše" || v.kat === kategorie);
}

/* ---- filtry se poskládají z kategorií, které v datech reálně jsou ---- */

function vykresliFiltry() {
  const kategorie_v_datech = [...new Set(VYMLUVY.map(v => v.kat))];
  el.filtry.innerHTML = "";

  for (const nazev of ["vše", ...kategorie_v_datech, OBLIBENE]) {
    const chip = document.createElement("button");
    chip.className = nazev === OBLIBENE ? "chip chip-oblibene" : "chip";
    chip.textContent = nazev === OBLIBENE ? `${nazev} (${oblibene.size})` : nazev;
    chip.setAttribute("aria-pressed", nazev === kategorie);
    chip.onclick = () => { kategorie = nazev; vykresliFiltry(); vykresliZasobu(); };
    el.filtry.appendChild(chip);
  }
}

/* ---- srdíčko na kartě ---- */

function vykresliSrdce() {
  if (!posledni) { el.srdce.style.display = "none"; return; }
  const jeOblibena = oblibene.has(posledni);
  el.srdce.style.display = "inline-flex";
  el.srdce.setAttribute("aria-pressed", jeOblibena);
  el.srdce.textContent = jeOblibena ? "♥" : "♡";
  el.srdce.title = jeOblibena ? "Odebrat z oblíbených" : "Přidat do oblíbených";
}

function prepniOblibenou() {
  if (!posledni) return;
  if (oblibene.has(posledni)) oblibene.delete(posledni);
  else oblibene.add(posledni);
  vykresliSrdce();
  vykresliFiltry();
  if (kategorie === OBLIBENE) vykresliZasobu();
}

/* ---- kolik výmluv je po ruce ---- */

function sklonuj(n) {
  if (n === 1) return "výmluva";
  if (n >= 2 && n <= 4) return "výmluvy";
  return "výmluv";
}

function vykresliZasobu() {
  const kolik = fond().length;
  el.zasoba.textContent = kolik;
  el.zasobaSlovo.textContent = sklonuj(kolik);
}

/* ---- losování ---- */

function vyber() {
  const nabidka = fond();
  if (nabidka.length === 0) return null;
  if (nabidka.length === 1) return nabidka[0];

  let kandidat;
  do {
    kandidat = nabidka[Math.floor(Math.random() * nabidka.length)];
  } while (kandidat === posledni);

  return kandidat;
}

function vymluvSe() {
  const v = vyber();
  if (!v) return;

  posledni = v;
  pocet++;

  el.vymluva.textContent = v.text;
  el.vymluva.classList.remove("uvodni");
  el.stitek.textContent = v.kat;
  el.pocet.textContent = pocet;
  vykresliSrdce();

  el.karta.classList.remove("nova");
  void el.karta.offsetWidth;
  el.karta.classList.add("nova");
}

/* ---- ovládání ---- */

el.btn.onclick = vymluvSe;
el.srdce.onclick = prepniOblibenou;

document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    vymluvSe();
  }
});

fetch("vymluvy.json")
  .then(r => r.json())
  .then(data => {
    VYMLUVY = data;
    vykresliFiltry();
    vykresliZasobu();
  })
  .catch(() => {
    el.vymluva.textContent = "Výmluvy se nepodařilo načíst. To je mimochodem taky výmluva.";
  });
</script>

</body>
</html>
